services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirvana
      POSTGRES_PASSWORD: hirvana
      POSTGRES_DB: hirvana
    ports:
      - "5432:5432"
    volumes:
      - hirvana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirvana -d hirvana"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hirvana_pgdata:
